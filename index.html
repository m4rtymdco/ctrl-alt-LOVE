<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ctrl + Alt + Love</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body { overflow: hidden; }

    .app {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      overflow: hidden;
      background: #111;
    }
    @media (min-width: 900px) {
      .app {
        max-width: 430px;
        height: min(920px, 96vh);
        margin: 2vh auto;
        border-radius: 28px;
        border: 1px solid #222;
        box-shadow: 0 30px 80px rgba(0,0,0,.7);
      }
    }

    .stage { position: absolute; inset: 0; }
    .bg-photo, .bg-video {
      width: 100%; height: 100%; object-fit: cover; display: none;
    }
    .bg-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(180deg, #3a2a22, #111);
      color: #888; font-size: 4rem;
    }
    .veil {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,.25) 38%, rgba(0,0,0,.72) 68%, #000 100%);
      pointer-events: none;
    }

    .topbar {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: calc(12px + env(safe-area-inset-top)) 18px 8px;
      z-index: 5;
    }
    .brand { font-size: 13px; font-weight: 700; letter-spacing: .04em; opacity: .9; }
    .badge {
      border: 0; border-radius: 999px; padding: 7px 12px;
      background: rgba(0,0,0,.35); color: #fff; font-size: 12px; font-weight: 700;
      backdrop-filter: blur(10px); cursor: pointer;
    }
    .badge.admin { background: #1DB954; color: #000; }

    .now {
      position: absolute; left: 0; right: 0; bottom: 0;
      z-index: 4;
      padding: 0 22px calc(18px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 14px;
    }

    .meta-row {
      display: flex; align-items: center; gap: 12px;
    }
    .mini-cover {
      width: 46px; height: 46px; border-radius: 8px; overflow: hidden;
      background: #333; flex-shrink: 0;
    }
    .mini-cover img, .mini-cover video { width: 100%; height: 100%; object-fit: cover; display: none; }
    .meta-text { flex: 1; min-width: 0; }
    .song-title {
      font-size: 22px; font-weight: 800; line-height: 1.1;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .song-artist { margin-top: 4px; font-size: 14px; color: rgba(255,255,255,.78); }

    .round-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.85);
      background: transparent; color: #fff; font-size: 22px; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .admin-only { display: none !important; }
    .admin-mode .admin-only { display: flex !important; }
    .admin-mode .admin-actions { display: block; }
    .admin-actions { display: none; }

    .progress-row { display: flex; flex-direction: column; gap: 6px; }
    input[type="range"] {
      width: 100%; accent-color: #fff; height: 4px; cursor: pointer;
    }
    .times {
      display: flex; justify-content: space-between;
      font-size: 12px; color: rgba(255,255,255,.75); font-variant-numeric: tabular-nums;
    }

    .controls {
      display: flex; align-items: center; justify-content: space-between;
      padding: 2px 4px;
    }
    .icon-btn {
      background: none; border: 0; color: #fff; cursor: pointer;
      width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
      opacity: .92;
    }
    .icon-btn.active { color: #1DB954; }
    .icon-btn svg { width: 26px; height: 26px; fill: currentColor; }
    .play-main {
      width: 72px; height: 72px; border-radius: 50%; border: 0;
      background: #fff; color: #111; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(0,0,0,.35);
    }
    .play-main svg { width: 34px; height: 34px; fill: currentColor; }
    .play-main .pause-ic { display: none; }
    .play-main.is-playing .play-ic { display: none; }
    .play-main.is-playing .pause-ic { display: block; }

    .util-row {
      display: flex; justify-content: space-between; padding: 0 6px 4px;
    }

    .lyrics {
      background: #e85d04;
      color: #1a0b04;
      border-radius: 16px;
      padding: 16px 16px 14px;
      max-height: 210px;
      overflow: hidden;
      position: relative;
    }
    .lyrics.hidden { display: none; }
    .lyrics.expanded { max-height: 48vh; overflow: auto; }
    .lyrics-kicker { font-size: 13px; font-weight: 800; margin-bottom: 10px; }
    .lyrics-body {
      font-size: 22px; font-weight: 800; line-height: 1.25;
      white-space: pre-wrap;
    }
    .lyrics-show {
      margin-top: 14px; border: 0; background: #fff; color: #111;
      border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: 13px; cursor: pointer;
    }
    .status-line { min-height: 0; font-size: 12px; color: #fca5a5; text-align: center; }
    .status-line:empty { display: none; }

    .sheet {
      position: absolute; inset: 0; background: rgba(0,0,0,.55);
      z-index: 20; display: none; align-items: flex-end;
    }
    .sheet.active { display: flex; }
    .sheet-card {
      width: 100%; max-height: 78%;
      background: #121212; border-radius: 18px 18px 0 0;
      padding: 10px 12px 24px; overflow: auto;
    }
    .sheet-handle {
      width: 42px; height: 4px; background: #444; border-radius: 4px; margin: 6px auto 14px;
    }
    .sheet-title { font-size: 13px; color: #aaa; letter-spacing: .12em; text-transform: uppercase; padding: 0 8px 10px; }
    .track-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 8px; border-radius: 10px; cursor: pointer;
    }
    .track-item.active { background: #1DB95422; }
    .track-thumb { width: 48px; height: 48px; border-radius: 8px; overflow: hidden; background: #333; flex-shrink: 0; }
    .track-thumb img, .track-thumb video { width: 100%; height: 100%; object-fit: cover; }
    .track-title { font-weight: 700; font-size: 15px; }
    .track-artist { color: #aaa; font-size: 13px; margin-top: 2px; }
    .track-info { flex: 1; min-width: 0; }
    .delete-track {
      background: none; border: 0; color: #888; cursor: pointer; font-size: 16px; padding: 6px;
    }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.8);
      display: none; align-items: center; justify-content: center; z-index: 40;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #282828; border-radius: 14px; padding: 28px 24px; width: 400px; max-width: 92%;
    }
    .modal h3 { margin-bottom: 18px; font-size: 22px; }
    .modal label { display: block; color: #bbb; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; }
    .modal input, .modal textarea {
      width: 100%; margin-bottom: 14px; padding: 12px; border-radius: 8px;
      border: 1px solid #444; background: #3a3a3a; color: #fff; font-size: 15px;
    }
    .modal textarea { min-height: 90px; resize: vertical; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .modal-actions button {
      border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 800; cursor: pointer;
    }
    .cancel { background: transparent; color: #bbb; border: 1px solid #555 !important; }
    .confirm { background: #1DB954; color: #000; }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="stage" id="livePhotoContainer">
      <div class="bg-placeholder" id="placeholder">🎵</div>
      <img class="bg-photo" id="livePhoto" alt="">
      <video class="bg-video" id="liveVideo" loop muted playsinline></video>
      <div class="veil"></div>
    </div>

    <div class="topbar">
      <div class="brand">Ctrl + Alt + Love</div>
      <button class="badge" id="modeBadge" type="button">User</button>
    </div>

    <div class="now">
      <div class="meta-row">
        <div class="mini-cover" id="miniCover">
          <img id="miniCoverImg" alt="">
          <video id="miniCoverVideo" muted></video>
        </div>
        <div class="meta-text">
          <div class="song-title" id="nowPlayingTitle">No track selected</div>
          <div class="song-artist" id="nowPlayingArtist">—</div>
        </div>
        <button class="round-btn admin-only" id="addTrackBtn" type="button" title="Add track">+</button>
      </div>

      <div class="progress-row">
        <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1">
        <div class="times">
          <span id="currentTime">0:00</span>
          <span id="durationTime">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="icon-btn" id="shuffleBtn" type="button" title="Shuffle">
          <svg viewBox="0 0 24 24"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>
        <button class="icon-btn" id="prevBtn" type="button" title="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6V6zm3.5 6 8.5 6V6l-8.5 6z"/></svg>
        </button>
        <button class="play-main" id="playBtn" type="button" title="Play">
          <svg class="play-ic" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg class="pause-ic" viewBox="0 0 24 24"><path d="M6 5h4v14H6V5zm8 0h4v14h-4V5z"/></svg>
        </button>
        <button class="icon-btn" id="nextBtn" type="button" title="Next">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2V6z"/></svg>
        </button>
        <button class="icon-btn" id="timerBtn" type="button" title="Sleep timer">
          <svg viewBox="0 0 24 24"><path d="M15 1H9v2h6V1zm-3 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16zm.5-13H11v6l5.2 3.1.8-1.3-4.5-2.7V8z"/></svg>
        </button>
      </div>

      <div class="util-row">
        <button class="icon-btn" id="shareBtn" type="button" title="Share">
          <svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8h-2v8H6v-8H4zm7-9.59V15h2V2.41L16.59 6 18 4.59 12 0 6 4.59 7.41 6 11 2.41z"/></svg>
        </button>
        <button class="icon-btn" id="queueBtn" type="button" title="Queue">
          <svg viewBox="0 0 24 24"><path d="M4 10h12v2H4v-2zm0-4h12v2H4V6zm0 8h8v2H4v-2zm10 0v6l5-3-5-3z"/></svg>
        </button>
      </div>

      <div class="lyrics hidden" id="lyricsCard">
        <div class="lyrics-kicker">Lyrics preview</div>
        <div class="lyrics-body" id="lyricsBody"></div>
        <button class="lyrics-show" id="showLyricsBtn" type="button">Show lyrics</button>
      </div>
      <div class="status-line" id="statusLine"></div>
    </div>

    <div class="sheet" id="queueSheet">
      <div class="sheet-card">
        <div class="sheet-handle"></div>
        <div class="sheet-title">Your library</div>
        <div id="trackList"></div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>Add new track</h3>
      <label>Title</label>
      <input type="text" id="trackTitleInput" placeholder="e.g. Panaginip">
      <label>Artist</label>
      <input type="text" id="trackArtistInput" placeholder="e.g. nicole">
      <label>Audio file (MP3)</label>
      <input type="file" id="audioFileInput" accept="audio/*">
      <label>Live photo (image, GIF, or short video)</label>
      <input type="file" id="imageFileInput" accept="image/*,video/*">
      <label>Lyrics (optional)</label>
      <textarea id="lyricsInput" placeholder="Paste lyrics here"></textarea>
      <div class="modal-actions">
        <button class="cancel" id="cancelModalBtn" type="button">Cancel</button>
        <button class="confirm" id="confirmModalBtn" type="button">Add track</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="loginOverlay">
    <div class="modal">
      <h3>Admin login</h3>
      <label>Password</label>
      <input type="password" id="adminPasswordInput" placeholder="Password">
      <div class="modal-actions">
        <button class="cancel" id="cancelLoginBtn" type="button">Cancel</button>
        <button class="confirm" id="confirmLoginBtn" type="button">Enter admin</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
