<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ctrl + Alt + Love · Spotify style</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Circular', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
      margin: 0;
    }

    .app {
      width: 1400px;
      max-width: 100%;
      height: 850px;
      max-height: 95vh;
      background-color: #000000;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
      border: 1px solid #282828;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background-color: #000000;
      border-bottom: 1px solid #282828;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo i {
      font-size: 28px;
      color: #1DB954;
      filter: drop-shadow(0 0 8px #1DB95440);
    }

    .logo h1 {
      font-size: 1.65rem;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.03em;
    }

    .admin-toggle {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge {
      background-color: #282828;
      border-radius: 500px;
      padding: 8px 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #B3B3B3;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge.admin {
      background-color: #1DB954;
      color: #000000;
      box-shadow: 0 0 18px #1DB95460;
    }

    .badge:hover {
      background-color: #3E3E3E;
      color: #FFFFFF;
    }

    .badge.admin:hover {
      background-color: #1ed760;
      color: #000000;
    }

    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .library {
      width: 300px;
      background-color: #121212;
      border-right: 1px solid #282828;
      display: flex;
      flex-direction: column;
      padding: 20px 0;
      border-radius: 0 0 0 8px;
    }

    .library-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px 18px;
    }

    .library-header h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #B3B3B3;
      font-weight: 700;
    }

    .admin-only { display: none !important; }
    .admin-mode .admin-only { display: flex !important; }

    .add-track-btn {
      background-color: #1DB954;
      border: none;
      color: #000000;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 15px #1DB95450;
    }

    .add-track-btn:hover {
      background-color: #1ed760;
      transform: scale(1.06);
    }

    .track-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .track-list::-webkit-scrollbar { width: 6px; }
    .track-list::-webkit-scrollbar-thumb { background: #535353; border-radius: 6px; }
    .track-list::-webkit-scrollbar-track { background: transparent; }

    .track-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
      border: 1px solid transparent;
    }

    .track-item:hover { background-color: #1A1A1A; }
    .track-item.active {
      background-color: #1DB95420;
      border-color: #1DB95440;
    }

    .track-thumb {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      background-color: #282828;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1DB954;
      font-size: 20px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .track-thumb img, .track-thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .track-info { flex: 1; min-width: 0; }
    .track-title {
      font-size: 0.9rem;
      font-weight: 500;
      color: #FFFFFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-artist {
      font-size: 0.75rem;
      color: #B3B3B3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .admin-actions { display: none; gap: 4px; }
    .admin-mode .admin-actions { display: flex; }

    .track-item .admin-actions button {
      background: transparent;
      border: none;
      color: #B3B3B3;
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .track-item .admin-actions button:hover {
      color: #1DB954;
      background: #1DB95420;
    }

    .player {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 40px;
      background-color: #121212;
      background-image: linear-gradient(180deg, #1a1a1a 0%, #121212 100%);
    }

    .live-photo-container {
      width: 340px;
      height: 340px;
      border-radius: 12px;
      background-color: #282828;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px #333333;
      overflow: hidden;
      position: relative;
      margin-bottom: 32px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .live-photo-container.playing {
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 0 2px #1DB954, 0 0 40px #1DB95430;
    }

    .live-photo, .live-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .live-photo-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #535353;
      font-size: 3rem;
      gap: 8px;
      width: 100%;
      height: 100%;
      background: #1e1e1e;
    }

    .live-photo-placeholder span {
      font-size: 0.9rem;
      color: #B3B3B3;
      font-weight: 400;
    }

    .visualizer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: linear-gradient(to top, #1DB95440, transparent);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
      padding: 0 10px 10px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .playing .visualizer { opacity: 1; }

    .bar {
      width: 4px;
      background: #1DB954;
      border-radius: 4px 4px 0 0;
      height: 10px;
      animation: wave 1.2s ease-in-out infinite;
      transform-origin: bottom;
    }

    @keyframes wave {
      0%, 100% { height: 10px; opacity: 0.6; }
      50% { height: 40px; opacity: 1; }
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 20px;
    }

    .ctrl-btn {
      background: transparent;
      border: none;
      color: #B3B3B3;
      font-size: 26px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
    }

    .ctrl-btn:hover {
      color: #FFFFFF;
      background: rgba(255, 255, 255, 0.05);
    }

    .ctrl-btn.play {
      background-color: #1DB954;
      color: #000000;
      width: 64px;
      height: 64px;
      font-size: 30px;
      box-shadow: 0 10px 25px #1DB95440;
    }

    .ctrl-btn.play:hover {
      background-color: #1ed760;
      transform: scale(1.05);
      color: #000000;
    }

    .progress-wrap {
      width: min(420px, 100%);
      display: flex;
      align-items: center;
      gap: 10px;
      color: #B3B3B3;
      font-size: 0.75rem;
      margin-bottom: 16px;
    }

    .progress-wrap input[type="range"] {
      flex: 1;
      accent-color: #1DB954;
      cursor: pointer;
    }

    .now-playing-info { text-align: center; margin-top: 8px; }
    .now-playing-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }
    .now-playing-artist {
      font-size: 0.9rem;
      color: #B3B3B3;
      font-weight: 400;
    }

    .status-line {
      margin-top: 14px;
      font-size: 0.8rem;
      color: #B3B3B3;
      min-height: 1.2em;
    }
    .status-line.error { color: #f87171; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background-color: #282828;
      border-radius: 12px;
      padding: 36px 32px;
      width: 440px;
      max-width: 92%;
      border: 1px solid #3E3E3E;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
    }

    .modal h3 {
      color: #FFFFFF;
      font-size: 1.5rem;
      margin-bottom: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .modal label {
      display: block;
      color: #B3B3B3;
      font-size: 0.8rem;
      margin-bottom: 6px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .modal input {
      width: 100%;
      padding: 14px 16px;
      background-color: #3E3E3E;
      border: 1px solid #535353;
      border-radius: 6px;
      color: #FFFFFF;
      font-size: 0.95rem;
      margin-bottom: 20px;
      outline: none;
      transition: border 0.2s;
    }

    .modal input:focus { border-color: #1DB954; }
    .modal input[type="file"] {
      padding: 10px 14px;
      background-color: #3E3E3E;
      color: #B3B3B3;
      font-size: 0.85rem;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 10px;
    }

    .modal-actions button {
      padding: 12px 28px;
      border-radius: 500px;
      border: none;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .modal-actions .cancel {
      background: transparent;
      color: #B3B3B3;
      border: 1px solid #535353;
    }
    .modal-actions .cancel:hover { background: #3E3E3E; color: #FFFFFF; }
    .modal-actions .confirm {
      background-color: #1DB954;
      color: #000000;
      box-shadow: 0 8px 20px #1DB95430;
    }
    .modal-actions .confirm:hover {
      background-color: #1ed760;
      transform: scale(1.02);
    }

    @media (max-width: 950px) {
      .library { width: 240px; }
      .live-photo-container { width: 280px; height: 280px; }
      .now-playing-title { font-size: 1.2rem; }
    }

    @media (max-width: 700px) {
      .library { width: 200px; }
      .live-photo-container { width: 220px; height: 220px; }
      .player { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="header">
      <div class="logo">
        <i>🎧</i>
        <h1>Ctrl + Alt + Love</h1>
      </div>
      <div class="admin-toggle">
        <button class="badge" id="modeBadge" type="button">👤 User</button>
      </div>
    </div>

    <div class="main">
      <div class="library">
        <div class="library-header">
          <h2>Your Library</h2>
          <button class="add-track-btn admin-only" id="addTrackBtn" title="Add track">+</button>
        </div>
        <div class="track-list" id="trackList"></div>
      </div>

      <div class="player" id="player">
        <div class="live-photo-container" id="livePhotoContainer">
          <div class="live-photo-placeholder" id="placeholder">
            🎵
            <span>Select a track</span>
          </div>
          <img class="live-photo" id="livePhoto" alt="Live photo">
          <video class="live-video" id="liveVideo" loop muted playsinline></video>
          <div class="visualizer" id="visualizer">
            <div class="bar" style="animation-delay: 0s"></div>
            <div class="bar" style="animation-delay: 0.2s"></div>
            <div class="bar" style="animation-delay: 0.4s"></div>
            <div class="bar" style="animation-delay: 0.1s"></div>
            <div class="bar" style="animation-delay: 0.3s"></div>
            <div class="bar" style="animation-delay: 0.5s"></div>
            <div class="bar" style="animation-delay: 0.2s"></div>
            <div class="bar" style="animation-delay: 0.4s"></div>
          </div>
        </div>

        <div class="player-controls">
          <button class="ctrl-btn" id="prevBtn" title="Previous">⏮</button>
          <button class="ctrl-btn play" id="playBtn" title="Play">▶</button>
          <button class="ctrl-btn" id="nextBtn" title="Next">⏭</button>
        </div>

        <div class="progress-wrap">
          <span id="currentTime">0:00</span>
          <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1">
          <span id="durationTime">0:00</span>
        </div>

        <div class="now-playing-info">
          <div class="now-playing-title" id="nowPlayingTitle">No track selected</div>
          <div class="now-playing-artist" id="nowPlayingArtist">—</div>
        </div>
        <div class="status-line" id="statusLine"></div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>Add new track</h3>
      <label>Title</label>
      <input type="text" id="trackTitleInput" placeholder="e.g. Midnight Dreams">
      <label>Artist</label>
      <input type="text" id="trackArtistInput" placeholder="e.g. Synthwave Collective">
      <label>Audio file (MP3)</label>
      <input type="file" id="audioFileInput" accept="audio/*">
      <label>Live photo (image, GIF, or short video)</label>
      <input type="file" id="imageFileInput" accept="image/*,video/*">
      <div class="modal-actions">
        <button class="cancel" id="cancelModalBtn" type="button">Cancel</button>
        <button class="confirm" id="confirmModalBtn" type="button">Add track</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="loginOverlay">
    <div class="modal">
      <h3>Admin login</h3>
      <label>Password</label>
      <input type="password" id="adminPasswordInput" placeholder="Password">
      <div class="modal-actions">
        <button class="cancel" id="cancelLoginBtn" type="button">Cancel</button>
        <button class="confirm" id="confirmLoginBtn" type="button">Enter admin</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
